# FORCE tests to use H2, never Supabase
spring.datasource.url=jdbc:h2:mem:magicpass_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Critical: stop loading your "local" profile during tests
spring.profiles.include=

# Optional: avoid template caching issues
spring.thymeleaf.cache=false

# Dummy stripe keys for tests (StripeService is mocked anyway)
stripe.api.key=sk_test_dummy
stripe.publishable.key=pk_test_dummy
