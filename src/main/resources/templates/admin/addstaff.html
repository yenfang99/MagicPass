<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Add Staff</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    body {
      margin: 0;
      display: flex;
      min-height: 100vh;
      background: var(--background);
    }

    /* Sidebar Styles */
    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 2px solid var(--border);
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 0 24px 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .sidebar-brand {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      margin: 0 0 4px;
    }

    .sidebar-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
    }

    .sidebar-menu {
      flex: 1;
      padding: 0 12px;
    }

    .menu-section {
      margin-bottom: 24px;
    }

    .menu-section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 12px 8px;
      margin: 0;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      margin: 4px 0;
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .menu-item:hover {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .menu-item.active {
      background: var(--primary);
      color: white;
    }

    .menu-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      margin-left: 260px;
      padding: 32px;
    }
  </style>
</head>
<body>

  <div th:replace="~{admin/fragments/admin-sidebar :: sidebar(activeTab='staff')}"></div>

<!-- Main Content -->
<main class="main-content">
  <section class="card">
    <h2 style="margin-top:0;">Create New Staff Account</h2>
    <p class="muted" style="margin-top:6px;">
      Staff accounts must use the <b>@magicpass.my</b> domain and will be able to log in
      through the same login page as normal users.
    </p>

    <!-- error / success messages -->
    <div th:if="${error}" class="alert" th:text="${error}"></div>
    <div th:if="${success}"
         class="alert"
         style="border-color:rgba(22,163,74,.35);
                background:rgba(22,163,74,.12);
                color:#bbf7d0;"
         th:text="${success}"></div>

    <form th:action="@{/staff/manage/add}" method="post" class="grid">

      <!-- field 1: EMAIL (own .field block) -->
      <div class="field">
        <div class="label">Staff Email (@magicpass.my)</div>
        <input class="input"
               type="email"
               name="email"
               placeholder="staff1@magicpass.my"
               th:value="${email}"
               required>
      </div>

      <!-- field 2: PASSWORD (separate .field block) -->
      <div class="field">
        <div class="label">Password</div>
        <input class="input"
               type="password"
               name="password"
               minlength="8"
               required>
        <div class="hint">
          At least 8 characters and one special symbol (e.g. ! @ #).
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" type="submit">Create Staff</button>
        <a class="btn btn-outline" th:href="@{/staff/manage}">Cancel</a>
      </div>
    </form>
  </section>
</main>

</body>
</html>
