<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar(activeTab)" class="sidebar">
  <div class="sidebar-header">
    <h1 class="sidebar-brand">MagicPass</h1>
    <p class="sidebar-subtitle">Admin Dashboard</p>
  </div>

  <nav class="sidebar-menu">
    <div class="menu-section">
      <h3 class="menu-section-title">Main</h3>
      <a href="/admin/dashboard" 
         class="menu-item"
         th:classappend="${activeTab == 'dashboard'} ? 'active'">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        Dashboard
      </a>
    </div>

    <div class="menu-section">
      <h3 class="menu-section-title">Management</h3>
      
      <a href="/admin/membership-types" 
         class="menu-item"
         th:classappend="${activeTab == 'membership-types'} ? 'active'">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        Membership Types
      </a>

      <a href="/admin/tickets" 
         class="menu-item"
         th:classappend="${activeTab == 'tickets'} ? 'active'">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 7v4a1 1 0 0 0 1 1h3"></path>
          <path d="M7 7v10"></path>
          <path d="M10 8v8a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1z"></path>
          <path d="M17 7v4a1 1 0 0 1-1 1h-3"></path>
          <path d="M17 7v10"></path>
        </svg>
        Tickets
      </a>

      <a href="/admin/users" 
         class="menu-item"
         th:classappend="${activeTab == 'users'} ? 'active'">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        Customers
      </a>

      <a href="/staff/manage" 
         class="menu-item"
         th:classappend="${activeTab == 'staff'} ? 'active'">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        Manage Staff
      </a>
    </div>

    <div class="menu-section">
      <h3 class="menu-section-title">Settings</h3>
      <a href="/admin/settings" 
         class="menu-item"
         th:classappend="${activeTab == 'settings'} ? 'active'">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 1v6m0 6v6m8.66-13.66l-4.24 4.24m-4.24 4.24l-4.24 4.24M23 12h-6m-6 0H1m20.66 8.66l-4.24-4.24m-4.24-4.24l-4.24-4.24"></path>
        </svg>
        Settings
      </a>
    </div>
  </nav>

  <div class="sidebar-footer">
    <div style="padding: 0 0 12px; border-bottom: 1px solid var(--border); margin-bottom: 12px;">
      <div style="font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 4px;">Logged in as:</div>
      <div style="font-size: 13px; font-weight: 600; color: var(--text);" th:text="${session.currentStaff?.email}">staff@magicpass.my</div>
      
      <div th:if="${session.isBoss}" style="display: inline-block; margin-top: 4px; padding: 2px 8px; background: #eef2ff; color: #1d4ed8; border-radius: 999px; font-size: 10px; font-weight: 700;">BOSS</div>
      <div th:unless="${session.isBoss}" style="display: inline-block; margin-top: 4px; padding: 2px 8px; background: #fee2e2; color: #b91c1c; border-radius: 999px; font-size: 10px; font-weight: 700;">STAFF</div>
    </div>
    <a href="/logout" class="btn btn-outline" style="width: 100%; justify-content: center; background: rgba(239,68,68,0.1); color: #dc2626;">
      Logout
    </a>
  </div>
</aside>

</body>
</html>
