<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${mode == 'create' ? 'Create' : 'Edit'} + ' Membership Type'">Membership Type Form</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    body {
      margin: 0;
      display: flex;
      min-height: 100vh;
      background: var(--background);
    }

    /* Sidebar Styles */
    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 2px solid var(--border);
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 0 24px 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .sidebar-brand {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      margin: 0 0 4px;
    }

    .sidebar-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
    }

    .sidebar-menu {
      flex: 1;
      padding: 0 12px;
    }

    .menu-section {
      margin-bottom: 24px;
    }

    .menu-section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 12px 8px;
      margin: 0;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      margin: 4px 0;
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .menu-item:hover {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .menu-item.active {
      background: var(--primary);
      color: white;
    }

    .menu-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      margin-left: 260px;
      padding: 32px;
    }
  </style>
</head>
<body>
  <div th:replace="~{admin/fragments/admin-sidebar :: sidebar(activeTab='membership-types')}"></div>

<!-- Main Content -->
<main class="main-content">
  <section class="card">
    <h2 style="margin-top:0;" th:text="${mode == 'create' ? 'Create New' : 'Edit'} + ' Membership Type'">Form</h2>

    <div th:if="${error}" class="alert" th:text="${error}"></div>

    <form th:action="${mode == 'create' ? '/admin/membership-types/create' : '/admin/membership-types/edit/' + membershipType.id}"
          th:object="${membershipType}"
          method="post">

      <div class="field">
        <label class="label" for="name">Name *</label>
        <input class="input" type="text" id="name" th:field="*{name}"
               placeholder="e.g., SILVER" required/>
        <div class="hint">Internal name (uppercase, no spaces). Used as unique identifier.</div>
      </div>

      <div class="field">
        <label class="label" for="displayName">Display Name *</label>
        <input class="input" type="text" id="displayName" th:field="*{displayName}"
               placeholder="e.g., Silver Membership" required/>
        <div class="hint">Name shown to customers.</div>
      </div>

      <div class="field">
        <label class="label" for="description">Description</label>
        <textarea class="input" id="description" th:field="*{description}" rows="3"
                  placeholder="Describe the benefits of this membership tier..."></textarea>
      </div>

      <div class="grid grid-3">
        <div class="field">
          <label class="label" for="price">Price (MYR) *</label>
          <input class="input" type="number" id="price" th:field="*{price}"
                 step="0.01" min="0" placeholder="99.00" required/>
        </div>

        <div class="field">
          <label class="label" for="discountRate">Discount Rate *</label>
          <input class="input" type="number" id="discountRate" th:field="*{discountRate}"
                 step="0.01" min="0" max="1" placeholder="0.05" required/>
          <div class="hint">Enter as decimal (0.05 = 5%)</div>
        </div>

        <div class="field">
          <label class="label" for="durationMonths">Duration (Months) *</label>
          <input class="input" type="number" id="durationMonths" th:field="*{durationMonths}"
                 min="1" placeholder="12" required/>
        </div>
      </div>

      <div class="grid grid-3">
        <div class="field">
          <label class="label" for="tierLevel">Tier Level *</label>
          <input class="input" type="number" id="tierLevel" th:field="*{tierLevel}"
                 min="1" placeholder="1" required/>
          <div class="hint">Higher number = higher tier (e.g., 1=Silver, 2=Gold, 3=Platinum)</div>
        </div>

        <div class="field">
          <label class="label" for="displayOrder">Display Order *</label>
          <input class="input" type="number" id="displayOrder" th:field="*{displayOrder}"
                 min="0" placeholder="0" required/>
          <div class="hint">Lower numbers appear first.</div>
        </div>

        <div class="field">
          <label class="label" for="active">Status *</label>
          <select class="input" id="active" th:field="*{active}" required>
            <option th:value="true">Active</option>
            <option th:value="false">Inactive</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <a class="btn btn-outline" th:href="@{/admin/membership-types}">Cancel</a>
        <button class="btn btn-primary" type="submit"
                th:text="${mode == 'create' ? 'Create' : 'Update'} + ' Membership Type'">Submit</button>
      </div>
    </form>
  </section>
</main>

</body>
</html>
