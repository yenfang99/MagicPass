<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Manage Tickets - Admin</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    body {
      margin: 0;
      display: flex;
      min-height: 100vh;
      background: var(--background);
    }

    /* Sidebar Styles */
    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 2px solid var(--border);
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 0 24px 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .sidebar-brand {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      margin: 0 0 4px;
    }

    .sidebar-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
    }

    .sidebar-menu {
      flex: 1;
      padding: 0 12px;
    }

    .menu-section {
      margin-bottom: 24px;
    }

    .menu-section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 12px 8px;
      margin: 0;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      margin: 4px 0;
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .menu-item:hover {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .menu-item.active {
      background: var(--primary);
      color: white;
    }

    .menu-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      margin-left: 260px;
      padding: 32px;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    .admin-table th,
    .admin-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
    }
    .admin-table th {
      background-color: #f9fafb;
      font-weight: 600;
      color: #374151;
    }
    .admin-table tr:hover {
      background-color: #f9fafb;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-paid {
      background-color: #d1fae5;
      color: #065f46;
    }
    .badge-preview {
      background-color: #fef9c3;
      color: #854d0e;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    .btn-sm {
      padding: 6px 12px;
      font-size: 14px;
    }
    .btn-group .icon {
      width: 18px;
      height: 18px;
      vertical-align: middle;
    }

    .btn-danger {
      color: #dc2626 !important;
      border-color: #dc2626 !important;
    }
    .btn-danger:hover {
      background-color: #fee2e2;
    }

    .alert-success {
      background-color: #d1fae5;
      border: 1px solid #10b981;
      color: #065f46;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .alert-error {
      background-color: #fee2e2;
      border: 1px solid #ef4444;
      color: #991b1b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div th:replace="~{admin/fragments/admin-sidebar :: sidebar(activeTab='tickets')}"></div>

<main class="main-content">
  <section class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 style="margin:0;">Tickets</h2>
      <a th:href="@{/admin/tickets/create}" class="btn btn-primary">
        + Create New Ticket
      </a>
    </div>

    <div th:if="${success}" class="alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <table class="admin-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Order Code</th>
          <th>Customer</th>
          <th>Date</th>
          <th>Qty</th>
          <th>Total (RM)</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="ticket : ${tickets}">
          <td th:text="${ticket.id}">1</td>
          <td th:text="${ticket.orderCode}">ORD-001</td>
          <td th:text="${ticket.customerId}">Customer</td>
          <td th:text="${ticket.reservationDate}">2024-12-15</td>
          <td>
            <span th:text="'A:' + ${ticket.adultQty} + ' S:' + ${ticket.studentQty} + ' C:' + ${ticket.childQty}">A:2 S:1 C:0</span>
          </td>
          <td th:text="'RM ' + ${#numbers.formatDecimal(ticket.grandTotal, 0, 2)}">RM 100.00</td>
          <td>
            <span th:if="${ticket.status == 'PAID'}" class="badge badge-paid">PAID</span>
            <span th:if="${ticket.status == 'PREVIEW'}" class="badge badge-preview">PREVIEW</span>
          </td>
          <td>
            <div class="btn-group">
              <!-- Edit Button with Icon -->
              <a th:href="@{/admin/tickets/edit/{id}(id=${ticket.id})}"
                class="btn btn-outline btn-sm"
                title="Edit">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                  <path d="M18.5 2.5l3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
              </a>

              <!-- Delete Button with Icon -->
              <form th:action="@{/admin/tickets/delete/{id}(id=${ticket.id})}"
                    method="post" style="display:inline;"
                    onsubmit="return confirm('Are you sure you want to delete this ticket?');">
                <button type="submit"
                        class="btn btn-outline btn-sm btn-danger"
                        title="Delete">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 6h18"></path>
                    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <path d="M5 6v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6"></path>
                    <path d="M10 11v6"></path>
                    <path d="M14 11v6"></path>
                  </svg>
                </button>
              </form>
            </div>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(tickets)}">
          <td colspan="8" style="text-align: center; padding: 40px; color: #9ca3af;">
            No tickets found. Create one to get started!
          </td>
        </tr>
      </tbody>
    </table>
  </section>
</main>

</body>
</html>
