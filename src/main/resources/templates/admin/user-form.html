<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${mode == 'create' ? 'Create' : 'Edit'} + ' User'">User Form</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    body {
      margin: 0;
      display: flex;
      min-height: 100vh;
      background: var(--background);
    }

    /* Sidebar Styles */
    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 2px solid var(--border);
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 0 24px 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .sidebar-brand {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      margin: 0 0 4px;
    }

    .sidebar-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
    }

    .sidebar-menu {
      flex: 1;
      padding: 0 12px;
    }

    .menu-section {
      margin-bottom: 24px;
    }

    .menu-section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 12px 8px;
      margin: 0;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      margin: 4px 0;
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .menu-item:hover {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .menu-item.active {
      background: var(--primary);
      color: white;
    }

    .menu-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      margin-left: 260px;
      padding: 32px;
    }
  </style>
</head>
<body>

  <div th:replace="~{admin/fragments/admin-sidebar :: sidebar(activeTab='users')}"></div>

<!-- Main Content -->
<main class="main-content">
  <section class="card">
    <h2 style="margin-top:0;" th:text="${mode == 'create' ? 'Create New' : 'Edit'} + ' User'">Form</h2>

    <div th:if="${error}" class="alert" th:text="${error}"></div>

    <form th:action="${mode == 'create' ? '/admin/users/create' : '/admin/users/edit/' + user.id}"
          th:object="${user}"
          method="post">

      <div class="field">
        <label class="label" for="email">Email *</label>
        <input class="input" type="email" id="email" th:field="*{email}"
               placeholder="user@example.com" required/>
      </div>

      <div class="field">
        <label class="label" for="passwordHash">Password *</label>
        <input class="input" type="password" id="passwordHash" th:field="*{passwordHash}"
               placeholder="Enter password" required/>
        <div class="hint" th:unless="${mode == 'create'}">Leave blank to keep current password.</div>
      </div>

      <div class="field">
        <label class="label" for="member">Member Status *</label>
        <select class="input" id="member" th:field="*{member}" required>
          <option th:value="true">Member</option>
          <option th:value="false">Non-member</option>
        </select>
      </div>

      <div class="actions">
        <a class="btn btn-outline" href="/admin/users">Cancel</a>
        <button class="btn btn-primary" type="submit"
                th:text="${mode == 'create' ? 'Create' : 'Update'} + ' User'">Submit</button>
      </div>
    </form>
  </section>
</main>

</body>
</html>
