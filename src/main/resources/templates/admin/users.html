<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Manage Users - Admin</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    body {
      margin: 0;
      display: flex;
      min-height: 100vh;
      background: var(--background);
    }

    /* Sidebar Styles */
    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 2px solid var(--border);
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 0 24px 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .sidebar-brand {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      margin: 0 0 4px;
    }

    .sidebar-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
    }

    .sidebar-menu {
      flex: 1;
      padding: 0 12px;
    }

    .menu-section {
      margin-bottom: 24px;
    }

    .menu-section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 12px 8px;
      margin: 0;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      margin: 4px 0;
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .menu-item:hover {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .menu-item.active {
      background: var(--primary);
      color: white;
    }

    .menu-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      margin-left: 260px;
      padding: 32px;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    .admin-table th,
    .admin-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
    }
    .admin-table th {
      background-color: #f9fafb;
      font-weight: 600;
      color: #374151;
    }
    .admin-table tr:hover {
      background-color: #f9fafb;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-active {
      background-color: #d1fae5;
      color: #065f46;
    }
    .badge-inactive {
      background-color: #fee2e2;
      color: #991b1b;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    .btn-sm {
      padding: 6px 12px;
      font-size: 14px;
    }
    .btn-group .icon {
      width: 18px;
      height: 18px;
      vertical-align: middle;
    }

    .btn-danger {
      color: #dc2626 !important;
      border-color: #dc2626 !important;
    }
    .btn-danger:hover {
      background-color: #fee2e2;
    }

    .alert-success {
      background-color: #d1fae5;
      border: 1px solid #10b981;
      color: #065f46;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .alert-error {
      background-color: #fee2e2;
      border: 1px solid #ef4444;
      color: #991b1b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<!-- Sidebar -->
  <div th:replace="~{admin/fragments/admin-sidebar :: sidebar(activeTab='users')}"></div>

<!-- Main Content -->
<main class="main-content">
  <section class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 style="margin:0;">Customers</h2>
      <a href="/admin/users/create" class="btn btn-primary">
        + Create New Customer
      </a>
    </div>

    <div th:if="${success}" class="alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <table class="admin-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Email</th>
          <th>Member Status</th>
          <th>Membership Type</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="u : ${userList}">
          <td th:text="${u.id}">1</td>
          <td th:text="${u.email}">user@example.com</td>
          <td>
            <span th:if="${userMembershipMap.containsKey(u.id)}" class="badge badge-active">Member</span>
            <span th:unless="${userMembershipMap.containsKey(u.id)}" class="badge badge-inactive">Non-member</span>
          </td>
          <td>
            <th:block th:if="${userMembershipMap.containsKey(u.id)}">
              <th:block th:with="membership=${userMembershipMap.get(u.id)}">
                <span th:if="${#strings.toUpperCase(membership.membershipType.name) == 'SILVER'}"
                      class="badge badge-silver"
                      th:text="${membership.membershipType.displayName}">Silver</span>
                <span th:if="${#strings.toUpperCase(membership.membershipType.name) == 'GOLD'}"
                      class="badge badge-gold"
                      th:text="${membership.membershipType.displayName}">Gold</span>
                <span th:if="${#strings.toUpperCase(membership.membershipType.name) == 'PLATINUM'}"
                      class="badge badge-platinum"
                      th:text="${membership.membershipType.displayName}">Platinum</span>
                <span th:unless="${#strings.toUpperCase(membership.membershipType.name) == 'SILVER' or #strings.toUpperCase(membership.membershipType.name) == 'GOLD' or #strings.toUpperCase(membership.membershipType.name) == 'PLATINUM'}"
                      class="badge badge-active"
                      th:text="${membership.membershipType.displayName}">Custom</span>
              </th:block>
            </th:block>
            <span th:unless="${userMembershipMap.containsKey(u.id)}" style="color: #9ca3af;">-</span>
          </td>
          <td th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd')}">2024-01-01</td>
          <td>
            <div class="btn-group">
              <!-- Edit removed: admin not allowed to edit users from UI -->

              <!-- Delete Button with Icon -->
              <form th:action="@{/admin/users/delete/{id}(id=${u.id})}"
                    method="post" style="display:inline;"
                    onsubmit="return confirm('Are you sure you want to delete this user?');">
                <button type="submit"
                        class="btn btn-outline btn-sm btn-danger"
                        title="Delete">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 6h18"></path>
                    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <path d="M5 6v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6"></path>
                    <path d="M10 11v6"></path>
                    <path d="M14 11v6"></path>
                  </svg>
                </button>
              </form>
            </div>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(userList)}">
          <td colspan="6" style="text-align: center; padding: 40px; color: #9ca3af;">
            No users found. Create one to get started!
          </td>
        </tr>
      </tbody>
    </table>
  </section>
</main>

</body>
</html>
