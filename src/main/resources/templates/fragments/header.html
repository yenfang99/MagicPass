<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
</head>
<body>

<!-- Header Fragment -->
<header th:fragment="header" class="nav">
  <div class="nav-inner">
    <a href="/" class="brand-link">
      <div class="brand">
        <div class="brand-logo">
          <span class="logo-icon">✨</span>
          <span class="brand-name">MagicPass</span>
        </div>
        <small>Theme Park Ticketing System</small>
      </div>
    </a>

    <nav class="nav-menu">
      <a class="nav-link" href="/tickets">
        <span>Tickets</span>
      </a>
      <a class="nav-link" href="/membership">
        <span>Membership</span>
      </a>

      <!-- Show login/register when not logged in -->
      <th:block th:if="${session.currentUser == null}">
        <a class="nav-link" href="/login">Login</a>
        <a class="nav-link" href="/register">Register</a>
      </th:block>

      <!-- Show user info and logout when logged in -->
      <th:block th:if="${session.currentUser != null}">
        <span class="user-info" th:text="${session.currentUser.email}">user@example.com</span>
        <a class="nav-link logout-link" href="/logout">Logout</a>
      </th:block>
    </nav>
  </div>
</header>

<!-- Header Styles -->
<style th:fragment="header-styles">
  .nav {
    position: sticky;
    top: 0;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 4px 20px rgba(15,23,42,.08);
    z-index: 100;
  }

  .nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand-link {
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s ease;
  }

  .brand-link:hover {
    transform: scale(1.02);
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    font-size: 28px;
    animation: sparkle 2s ease-in-out infinite;
  }

  @keyframes sparkle {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.8; }
  }

  .brand-name {
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.5px;
  }

  .brand small {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    margin-left: 38px;
  }

  .nav-menu {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .nav-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 12px;
    text-decoration: none;
    color: var(--text);
    font-weight: 600;
    font-size: 14px;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .nav-link::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(102,126,234,0.1) 0%, rgba(118,75,162,0.1) 100%);
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .nav-link:hover::before {
    opacity: 1;
  }

  .nav-link:hover {
    transform: translateY(-2px);
    color: var(--primary);
  }

  .nav-link.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    box-shadow: 0 4px 12px rgba(102,126,234,0.3);
  }

  .nav-link.active::before {
    display: none;
  }

  .nav-icon {
    font-size: 18px;
  }

  .user-info {
    display: flex;
    align-items: center;
    padding: 10px 18px;
    border-radius: 12px;
    background: var(--primary-soft);
    color: var(--primary);
    font-weight: 600;
    font-size: 14px;
    border: 2px solid transparent;
  }

  .logout-link {
    background: rgba(239,68,68,0.1);
    color: #dc2626;
  }

  .logout-link:hover {
    background: #dc2626;
    color: white;
  }

  .logout-link:hover::before {
    display: none;
  }

  /* Responsive Design */
  @media (max-width: 768px) {
    .nav-inner {
      padding: 10px 16px;
    }

    .brand-name {
      font-size: 20px;
    }

    .brand small {
      font-size: 10px;
      margin-left: 30px;
    }

    .nav-menu {
      gap: 4px;
    }

    .nav-link span:not(.nav-icon) {
      display: none;
    }

    .nav-link {
      padding: 10px 12px;
    }
  }

  @media (max-width: 480px) {
    .logo-icon {
      font-size: 24px;
    }

    .brand-name {
      font-size: 18px;
    }

    .brand small {
      display: none;
    }

    .nav-icon {
      font-size: 20px;
    }
  }
</style>

</body>
</html>
