<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Login</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  
  <!-- Include Header Styles -->
  <th:block th:replace="~{fragments/header :: header-styles}"></th:block>
</head>
<body>
  <!-- Include Header Fragment -->
  <div th:replace="~{fragments/header :: header}"></div>

<!-- <header class="nav">
  <div class="nav-inner">
    <div class="brand">
      MagicPass
      <small>Login</small>
    </div>
    <a class="btn btn-outline" href="/">Home</a>
  </div>
</header> -->

<main class="container">
  <section class="card">
    <h2 style="margin-top:0;">Login to MagicPass</h2>
    <p class="muted" style="margin-top:6px;">Enter your registered email and password.</p>

    <!-- error message -->
    <div th:if="${error}" class="alert" th:text="${error}"></div>

    <!-- success message (e.g. after register) -->
    <div th:if="${success}"
         class="alert alert-success"
         th:text="${success}"></div>

    <form method="post" action="/login" class="grid">
      <div class="field">
        <div class="label">Email</div>
        <input class="input"
               type="email"
               name="email"
               placeholder="you@example.com"
               required>
      </div>

      <div class="field">
        <div class="label">Password</div>
        <input class="input"
               type="password"
               name="password"
               minlength="8"
               required>
        <div class="hint">Use the password you set during registration.</div>
      </div>

      <div class="actions">
        <button type="submit" class="btn btn-primary">Login</button>
        <a href="/register" class="btn btn-outline">Create new account</a>
      </div>
    </form>
  </section>
</main>
</body>
</html>
