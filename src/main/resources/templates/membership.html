<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Membership Plans - MagicPass</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">

  <!-- Include Header Styles -->
  <th:block th:replace="~{fragments/header :: header-styles}"></th:block>

  <style>
    .membership-hero {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      padding: 50px 28px;
      border-radius: 18px;
      margin-bottom: 40px;
    }
    .membership-hero h1 {
      font-size: 42px;
      margin: 0 0 12px;
    }
    .membership-hero p {
      font-size: 18px;
      margin: 0;
      opacity: 0.95;
    }
    .membership-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 28px;
      margin-bottom: 40px;
    }
    .membership-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 32px;
      text-align: center;
      transition: all 0.3s ease;
      position: relative;
    }
    .membership-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(15,23,42,.15);
    }
    .membership-card.featured {
      border-color: var(--primary);
      box-shadow: 0 12px 30px rgba(37,99,235,.2);
    }
    .membership-card.featured::before {
      content: "POPULAR";
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary);
      color: white;
      padding: 6px 20px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .membership-card.disabled {
      opacity: 0.6;
      pointer-events: none;
    }
    .membership-card.current-plan {
      border-color: #10b981;
      background: linear-gradient(to bottom, var(--surface), rgba(16, 185, 129, 0.05));
    }
    .tier-badge {
      position: absolute;
      top: -12px;
      right: 20px;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .tier-badge.current {
      background: #10b981;
      color: white;
    }
    .tier-badge.lower {
      background: #94a3b8;
      color: white;
    }
    .tier-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    .tier-name {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--text);
    }
    .tier-price {
      font-size: 48px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .tier-price .currency {
      font-size: 24px;
    }
    .tier-period {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .tier-benefits {
      text-align: left;
      margin-bottom: 28px;
      padding: 20px;
      background: var(--primary-soft);
      border-radius: 12px;
    }
    .tier-benefits h4 {
      margin: 0 0 12px;
      font-size: 16px;
      color: var(--primary);
    }
    .tier-benefits ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .tier-benefits li {
      padding: 8px 0;
      color: var(--text);
      font-size: 14px;
    }
    .tier-benefits li::before {
      content: "✓ ";
      color: var(--primary);
      font-weight: 800;
      margin-right: 8px;
    }
    .purchase-btn {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
    }
    .silver-card { border-color: #c0c0c0; }
    .silver-card .tier-price { color: #8c8c8c; }
    .gold-card { border-color: #ffd700; }
    .gold-card .tier-price { color: #d4af37; }
    .platinum-card { border-color: #e5e4e2; }
    .platinum-card .tier-price { color: #667eea; }

    @media (min-width: 992px) {
      .membership-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Optional: nicer spacing on very large screens */
    @media (min-width: 1400px) {
      .membership-grid {
        max-width: 1400px;
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>
</head>
<body>

<!-- Include Header Fragment -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="container">

  <section class="membership-hero">
    <h1>Become a Member</h1>
    <p>Unlock exclusive benefits and save on every visit!</p>
  </section>


  <div th:if="${success}" class="alert" style="background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.35); color: #22c55e; margin-bottom: 20px;">
    <span th:text="${success}"></span>
  </div>

  <div th:if="${error}" class="alert" style="margin-bottom: 20px; color: #d62020;">
    <span th:text="${error}"></span>
  </div>

  <div class="membership-grid">

    <!-- Dynamic Membership Cards from Database -->
    <th:block th:each="type, iterStat : ${membershipTypes}">
      <th:block th:with="
        canPurchase=${type.tierLevel > currentTierLevel},
        isCurrent=${currentMembership != null and type.tierLevel == currentTierLevel},
        isLower=${currentMembership != null and type.tierLevel < currentTierLevel}">

        <div class="membership-card"
             th:classappend="${iterStat.index == 1 and canPurchase ? 'featured' : ''} + ${isCurrent ? ' current-plan' : ''} + ${isLower ? ' disabled' : ''}">

          <!-- Badge for current or lower tier -->
          <span th:if="${isCurrent}" class="tier-badge current">Your Plan</span>
          <span th:if="${isLower}" class="tier-badge lower">Lower Tier</span>

          <!-- Dynamic Icon based on name -->
          <div class="tier-icon" th:text="${type.name == 'SILVER' ? '🥈' : (type.name == 'GOLD' ? '🥇' : (type.name == 'PLATINUM' ? '💎' : '✨'))}">✨</div>

      <div class="tier-name" th:text="${type.displayName}">Membership</div>

      <div class="tier-price">
        <span class="currency">RM</span><span th:text="${#numbers.formatDecimal(type.price, 0, 0)}">99</span>
      </div>

      <div class="tier-period" th:text="'per ' + ${type.durationMonths == 12 ? 'year' : type.durationMonths + ' months'}">per year</div>

      <div class="tier-benefits">
        <h4>Benefits Include:</h4>
        <ul>
          <!-- Parse description sentences and display each as separate list item -->
          <th:block th:if="${type.description != null and !#strings.isEmpty(type.description)}">
            <li th:each="sentence : ${#strings.arraySplit(type.description, '.')}"
                th:if="${!#strings.isEmpty(#strings.trim(sentence))}"
                th:text="${#strings.trim(sentence)}">Description sentence</li>
          </th:block>
        </ul>
      </div>

          <!-- Purchase form with conditional button -->
          <form th:action="@{/membership/purchase}" method="post">
            <input type="hidden" name="membershipTypeId" th:value="${type.id}"/>

            <!-- Show different button states based on tier level -->
            <button th:if="${canPurchase}"
                    type="submit"
                    class="btn btn-primary purchase-btn"
                    th:text="'Purchase ' + ${type.displayName}">Purchase</button>

            <button th:if="${isCurrent}"
                    type="button"
                    class="btn btn-primary purchase-btn"
                    disabled
                    style="opacity: 0.6; cursor: not-allowed; background: #10b981; border-color: #10b981;"
                    th:text="'Current Plan'">Current Plan</button>

            <button th:if="${isLower}"
                    type="button"
                    class="btn btn-primary purchase-btn"
                    disabled
                    style="opacity: 0.5; cursor: not-allowed; background: #94a3b8; border-color: #94a3b8;"
                    th:text="'Not Available'">Not Available</button>

            <!-- Users without membership can buy any tier -->
            <button th:if="${currentMembership == null and !canPurchase}"
                    type="submit"
                    class="btn btn-primary purchase-btn"
                    th:text="'Purchase ' + ${type.displayName}">Purchase</button>
          </form>
        </div>
      </th:block>
    </th:block>

    <!-- Show message if no membership types available -->
    <div th:if="${#lists.isEmpty(membershipTypes)}"
         style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--muted);">
      <p style="font-size: 18px; margin: 0;">No membership plans available at the moment.</p>
      <p style="font-size: 14px; margin-top: 8px;">Please check back later!</p>
    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Find both success and error alerts
      const alert = document.querySelector('.alert');
      if (alert) {
        // Auto-hide after 5 seconds
        setTimeout(function () {
          alert.style.transition = 'opacity 0.6s ease';
          alert.style.opacity = '0';
          // Remove from DOM after fade-out
          setTimeout(() => alert.remove(), 700);
        }, 5000);
      }
    });
  </script>

</main>

</body>
</html>
