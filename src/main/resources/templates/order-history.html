<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Order History - MagicPass</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <th:block th:replace="~{fragments/header :: header-styles}"></th:block>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container">
  <section class="card">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
      <div>
        <h2 style="margin:0;">Order History</h2>
        <p class="muted" style="margin:4px 0 0 0;">Tickets you have purchased.</p>
      </div>
    </div>

    <div th:if="${orders == null or #lists.isEmpty(orders)}" style="margin-top:18px; padding:16px; background: var(--primary-soft); border:1px dashed var(--border); border-radius:12px;">
      <div style="font-weight:700; margin-bottom:6px;">No orders yet</div>
      <div class="muted">Once you purchase tickets, they will appear here.</div>
    </div>

    <div th:if="${orders != null and !#lists.isEmpty(orders)}" style="margin-top:16px; overflow-x:auto;">
      <table class="table">
        <tr style="background:rgba(15,23,42,.02);">
          <td class="muted">Order</td>
          <td class="muted right">Reservation</td>
          <td class="muted right">Qty</td>
          <td class="muted right">Total (RM)</td>
          <td class="muted right">Status</td>
          <td class="muted right">Payment</td>
          <td class="muted right">Actions</td>
        </tr>
        <tr th:each="order : ${orders}">
          <td>
            <div style="font-weight:700;" th:text="${order.orderCode != null ? order.orderCode : 'ORD-' + order.id}">ORD-1</div>
            <div class="muted" style="font-size:12px;" th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}">09 Dec 2025</div>
          </td>
          <td class="right" th:text="${#temporals.format(order.reservationDate, 'dd/MM/yyyy')}">09/12/2025</td>
          <td class="right" th:text="${order.adultQty + order.studentQty + order.childQty}">2</td>
          <td class="right" th:text="${#numbers.formatDecimal(order.grandTotal, 1, 'COMMA', 2, 'POINT')}">0.00</td>
          <td class="right">
            <span th:text="${order.status}">PAID</span>
          </td>
          <td class="right" th:text="${order.paymentMethod}">CARD</td>
          <td class="right">
            <a th:href="@{'/receipt/' + ${order.id} + '?from=history'}" class="btn btn-outline" style="padding:8px 10px; font-size:13px;">View</a>
          </td>
        </tr>
      </table>
    </div>

    <!-- <div class="actions" style="margin-top:16px;">
      <a class="btn btn-primary" href="/tickets">Buy Tickets</a>
    </div> -->
  </section>
</main>

</body>
</html>
