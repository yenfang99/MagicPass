<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Payment Preview</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <div class="brand">
      Disney Ticketing
      <small>Payment Preview</small>
    </div>
    <a class="btn btn-outline" href="/tickets">Edit</a>
  </div>
</header>

<main class="container">
  <section class="card">
    <h2 style="margin-top:0;">Payment Preview</h2>
    <p class="muted" style="margin-top:6px;">Review the breakdown before selecting payment method.</p>

    <!-- Option B: no DB order yet, so no Order ID here -->
    <p class="muted" style="margin-top:6px;">
      Reservation Date:
      <b th:text="${#temporals.format(req.reservationDate, 'yyyy-MM-dd')}"></b>
    </p>

    <p class="muted" style="margin-top:10px;">
      Tickets:
      Adult <b th:text="${req.adultQty}"></b>,
      Student <b th:text="${req.studentQty}"></b>,
      Children <b th:text="${req.childQty}"></b>
    </p>

    <table class="table" style="margin-top:14px;">
      <tr>
        <td class="muted">Total</td>
        <td class="right" th:text="${pricing.total}"></td>
      </tr>
      <tr>
        <td class="muted">Discount</td>
        <td class="right" th:text="${pricing.discount}"></td>
      </tr>
      <tr>
        <td class="muted">Tax (6%)</td>
        <td class="right" th:text="${pricing.tax}"></td>
      </tr>
      <tr>
        <td class="bold">Grand Total</td>
        <td class="right bold" th:text="${pricing.grandTotal}"></td>
      </tr>
    </table>

    <!-- Option B: only submit paymentMethod; order will be created in /payment/confirm -->
    <form th:action="@{/payment/confirm}" method="post" style="margin-top:16px;">

      <div class="field" style="margin-top:14px;">
        <div class="label">Payment Method</div>
        <select class="input" name="paymentMethod" required>
          <option value="" selected disabled>Select a method</option>
          <option value="CARD">Card</option>
          <option value="FPX">FPX (Online Banking)</option>
          <option value="TNG">Touch 'n Go eWallet</option>
          <option value="CASH">Cash (Counter)</option>
        </select>
        <div class="hint">This is a demo payment (no real gateway yet).</div>
      </div>

      <div class="actions">
        <a class="btn btn-outline" href="/tickets">Back</a>
        <button class="btn btn-primary" type="submit">Pay &amp; Generate Receipt</button>
      </div>
    </form>

  </section>
</main>

</body>
</html>
