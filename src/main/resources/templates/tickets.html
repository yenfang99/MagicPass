<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Purchase Ticket</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

</head>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const display = document.getElementById("reservationDateDisplay");
  const isoHidden = document.getElementById("reservationDateIso");

  const pad = (n) => String(n).padStart(2, "0");
  const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

  const today = new Date();
  const max = new Date();
  max.setDate(today.getDate() + 7);

  // prefer server-provided ISO value if present
  const existingIso = isoHidden.value;
  const initialDate = existingIso ? new Date(existingIso) : today;
  isoHidden.value = toISO(initialDate);

  flatpickr(display, {
    dateFormat: "d/m/Y",     // UI display: dd/MM/yyyy
    defaultDate: initialDate,
    minDate: today,
    maxDate: max,
    allowInput: false,       // prevent manual typing
    disableMobile: true,     // consistent UI picker (optional)
    onChange: function(selectedDates) {
      if (selectedDates && selectedDates.length > 0) {
        isoHidden.value = toISO(selectedDates[0]); // submit ISO
      }
    }
  });
});
</script>
