<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Purchase Ticket</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

  <!-- Include Header Styles -->
  <th:block th:replace="~{fragments/header :: header-styles}"></th:block>

</head>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const display = document.getElementById("reservationDateDisplay");
  const isoHidden = document.getElementById("reservationDateIso");

  const pad = (n) => String(n).padStart(2, "0");
  const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const isSameDay = (a, b) =>
    a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth() &&
    a.getDate() === b.getDate();

  const today = new Date();
  const startOfToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const min = new Date(today); // earliest allowed is today
  const max = new Date(today);
  max.setDate(today.getDate() + 7); // latest allowed is 7 days ahead

  // prefer server-provided ISO value if present
  const existingIso = isoHidden.value;
  let initialDate = existingIso ? new Date(existingIso) : min;
  if (initialDate < min) initialDate = min;
  if (initialDate > max) initialDate = max;
  isoHidden.value = toISO(initialDate);

  flatpickr(display, {
    dateFormat: "d/m/Y",     // UI display: dd/MM/yyyy
    defaultDate: initialDate,
    minDate: min,
    maxDate: max,
    allowInput: false,       // prevent manual typing
    disableMobile: true,     // consistent UI picker (optional)
    onDayCreate: function(_dObj, _dStr, fp, dayElem) {
      const date = dayElem.dateObj;
      if (isSameDay(date, startOfToday)) {
        dayElem.classList.add("fp-today-indicator");
      }
    },
    onChange: function(selectedDates) {
      if (selectedDates && selectedDates.length > 0) {
        isoHidden.value = toISO(selectedDates[0]); // submit ISO
      }
    }
  });
});
</script>

<body>
<!-- Include Header Fragment -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="container">
  <section class="card">
    <h2 style="margin-top:0;">Purchase Ticket</h2>
    <p class="muted" style="margin-top:6px;">Select ticket quantity and reservation date.</p>

    <div th:if="${error}" class="alert" th:text="${error}"></div>

    <form th:action="@{/tickets/preview}" th:object="${req}" method="post">
      <div class="grid grid-3">
        <div class="field">
          <div class="label">Adult (RM370)</div>
          <input class="input" type="number" th:field="*{adultQty}" min="0" value="0"/>
        </div>

        <div class="field">
          <div class="label">Student (RM320)</div>
          <input class="input" type="number" th:field="*{studentQty}" min="0" value="0"/>
        </div>

        <div class="field">
          <div class="label">Children (RM250)</div>
          <input class="input" type="number" th:field="*{childQty}" min="0" value="0"/>
        </div>
      </div>

      <div class="field" style="margin-top:14px;">
        <div class="label">Reservation Date (dd/MM/yyyy)</div>
        <!-- what user sees -->
        <input class="input" type="text" id="reservationDateDisplay" placeholder="Select date" />
        <!-- hidden value that gets submitted to Spring (ISO) -->
        <input type="hidden" th:field="*{reservationDate}" id="reservationDateIso"/>
        <div class="hint">Reservation is allowed from today and within the next 7 days only.</div>
      </div>


      <div class="actions">
        <button class="btn btn-primary" type="submit">Preview Payment</button>
        <a class="btn btn-outline" href="/">Back</a>
      </div>

    </form>
  </section>
</main>

</body>
</html>
