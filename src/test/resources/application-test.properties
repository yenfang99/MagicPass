# Test Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration for Tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (optional, useful for debugging)
spring.h2.console.enabled=true

# Stripe Test Keys (use test mode keys)
stripe.api.key=sk_test_mock_key_for_testing
stripe.publishable.key=pk_test_mock_key_for_testing

# Server Configuration
server.port=0
